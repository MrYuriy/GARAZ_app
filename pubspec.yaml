name: garaz_app
description: "GARAZ — rejestr uprawnień operatorów i zdarzeń wózków widłowych (web + Android)."
publish_to: 'none'

version: 0.3.2+5

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  # Polish Material texts (date picker, dialogs): the interface is Polish only.
  flutter_localizations:
    sdk: flutter
  # Same stack as langup_mobile: state, HTTP, secure token storage, routing.
  flutter_riverpod: 2.6.1
  dio: 5.11.0
  flutter_secure_storage: 11.0.0
  go_router: 17.5.0
  web: 1.1.1
  # Choosing a scanned permit document to upload.
  file_picker: 13.4.0
  # Incident reports (F2): the operator card scanner, the camera, the report's client id.
  mobile_scanner: 7.5.0
  image_picker: 1.2.4
  uuid: 4.6.0
  # Exports on the phone: written to a temp file, then opened or shared.
  path_provider: 2.1.6
  share_plus: 13.3.1
  open_filex: 5.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/i18n/
